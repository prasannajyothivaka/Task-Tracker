name: Build and Deploy Task Tracker App

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node.js for React
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Stable for most React apps

      # 3️⃣ Build React frontend
      - name: Build React frontend
        working-directory: services/frontend
        env:
          CI: false  # Prevents React build from failing in CI
        run: |
          echo "📦 Installing frontend dependencies..."
          npm ci || (echo "❌ npm ci failed"; exit 1)

          echo "🏗️ Building React app..."
          npm run build || (echo "❌ React build failed"; ls -la; exit 1)

          echo "✅ React build completed. Listing contents..."
          ls -la build || echo "❌ Build folder missing!"

          echo "📁 Copying React build to backend/app..."
          mkdir -p ../../backend/app
          cp -r build ../../backend/app/
          echo "📋 Verifying copied build folder..."
          ls -R ../../backend/app/build || echo "❌ Build folder missing!"

      # 4️⃣ Setup Python for backend
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5️⃣ Install backend dependencies
      - name: Install Python dependencies
        working-directory: services/backend
        run: |
          python -m venv venv
          echo "🔹 Activating virtual environment..."
          source venv/bin/activate

          echo "📦 Upgrading pip..."
          pip install --upgrade pip

          echo "📦 Installing backend dependencies..."
          pip install -r requirements.txt || (echo "❌ pip install failed"; exit 1)

          echo "✅ Backend dependencies installed."

      # 6️⃣ Clean pycache and confirm structure
      - name: Verify backend/app structure
        run: |
          echo "🧹 Cleaning __pycache__ directories..."
          find services/backend/app -name "__pycache__" -type d -exec rm -r {} + || true

          echo "📂 Listing backend/app folder contents:"
          ls -R services/backend/app

      # 7️⃣ Upload artifact (backend + React build)
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            services/backend/**
            !services/backend/venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 1️⃣ Download artifact from build job
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # 2️⃣ List downloaded files for debug
      - name: Verify downloaded artifact
        run: |
          echo "📦 Verifying downloaded artifact..."
          ls -R

      # 3️⃣ Deploy to Azure
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'task-tracker'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_288C5559F181476BB304241DB12D2D44 }}

      # 4️⃣ Confirm deployment
      - name: Deployment debug
        run: |
          echo "✅ Deployment step completed. Check Azure portal for live app."
