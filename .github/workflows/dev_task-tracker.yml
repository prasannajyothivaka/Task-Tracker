name: Build and Deploy Task Tracker App
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node (React frontend)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ Build React frontend
      - name: Build React frontend
        working-directory: services/frontend
        run: |
          npm install
          CI=false npm run build
          # Copy build folder to backend/app
          mkdir -p ../../backend/app
          cp -r build/* ../../backend/app/

      # 4️⃣ Setup Python
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5️⃣ Install backend dependencies
      - name: Install Python dependencies
        working-directory: services/backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 6️⃣ Clean old caches
      - name: Remove old pycache
        run: find services/backend/app -name "__pycache__" -type d -exec rm -r {} +

      # 7️⃣ Verify backend folder contents
      - name: List backend/app files
        run: ls -R services/backend/app

      # 8️⃣ Upload artifact (backend + React build)
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            services/backend/**
            !services/backend/venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 1️⃣ Download artifact
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # 2️⃣ Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'task-tracker'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_288C5559F181476BB304241DB12D2D44 }}

      # 3️⃣ Restart App Service to force reload
      - name: Restart Azure App Service
        uses: azure/cli@v1
        with:
          inlineScript: |
            az webapp restart --name task-tracker --resource-group <YOUR_RESOURCE_GROUP>
